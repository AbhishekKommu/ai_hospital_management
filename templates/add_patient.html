{% extends "base.html" %}
{% block title %}Add Patient · AI Hospital{% endblock %}

{% block content %}
<div class="form-wrapper">
  <h2><i class="fas fa-user-plus" style="color:var(--accent);"></i> Add New Patient</h2>
  <p class="subtitle">Fill the patient's details below</p>

  <form method="POST">
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Patient name" required>
    </div>
    <div class="form-group">
      <label>Age</label>
      <input type="number" name="age" min="0" max="130" placeholder="0" required>
    </div>
    <div class="form-group">
      <label>Gender</label>
      <select name="gender" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>
    </div>
    <div class="form-group">
      <label>Phone</label>
      <input type="text" name="phone" placeholder="Contact number" required>
    </div>
    <div class="form-group">
      <label>Diagnosis</label>
      <textarea name="diagnosis" placeholder="Diagnosis details..." required></textarea>
    </div>
    <div class="form-group">
      <label>Status</label>
      <select name="status">
        <option>Stable</option>
        <option>Recovering</option>
        <option>Critical</option>
      </select>
    </div>

    <button type="submit" class="btn" style="width:100%; justify-content:center;">
      <i class="fas fa-save"></i> Save Patient
    </button>
  </form>
</div>
{% endblock %}
