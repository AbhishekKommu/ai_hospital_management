{% extends "base.html" %}
{% block title %}Register · AI Hospital{% endblock %}

{% block content %}
<div class="form-wrapper">
  <h2><i class="fas fa-user-plus" style="color:var(--accent);"></i> Create Account</h2>
  <p class="subtitle">Join the AI Hospital Management System</p>

  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Choose a username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Create a password" required minlength="4">
    </div>

    <button type="submit" class="btn" style="width:100%; justify-content:center;">
      <i class="fas fa-user-plus"></i> Register
    </button>
  </form>

  <p style="text-align:center; margin-top:1.5rem; color:#5b7e99; font-size:0.9rem;">
    Already registered?
    <a href="{{ url_for('login') }}" style="color:var(--primary); font-weight:600; text-decoration:none;">Login</a>
  </p>
</div>
{% endblock %}
