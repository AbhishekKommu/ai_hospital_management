{% extends "base.html" %}
{% block title %}New Appointment · AI Hospital{% endblock %}

{% block content %}
<div class="form-wrapper">
  <h2><i class="fas fa-calendar-plus" style="color:var(--accent);"></i> Book Appointment</h2>
  <p class="subtitle">Schedule a patient's appointment</p>

  <form method="POST">
    <div class="form-group">
      <label>Patient Name</label>
      <input type="text" name="patient_name" placeholder="Patient name" required>
    </div>
    <div class="form-group">
      <label>Doctor</label>
      <select name="doctor_name" required onchange="fillDept(this)">
        <option value="">Select doctor</option>
        {% for d in doctors %}
        <option value="{{ d.name }}" data-dept="{{ d.department }}">
          {{ d.name }} ({{ d.department }})
        </option>
        {% endfor %}
      </select>
    </div>
    <div class="form-group">
      <label>Department</label>
      <input type="text" name="department" id="deptField" placeholder="Auto-filled" required>
    </div>
    <div class="form-group">
      <label>Date</label>
      <input type="date" name="date" required>
    </div>
    <div class="form-group">
      <label>Time</label>
      <input type="time" name="time" required>
    </div>

    <button type="submit" class="btn" style="width:100%; justify-content:center;">
      <i class="fas fa-check"></i> Confirm Appointment
    </button>
  </form>
</div>

<script>
  function fillDept(sel) {
    const opt = sel.options[sel.selectedIndex];
    document.getElementById("deptField").value = opt.dataset.dept || "";
  }
</script>
{% endblock %}
