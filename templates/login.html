{% extends "base.html" %}
{% block title %}Login · AI Hospital{% endblock %}

{% block content %}
<div class="form-wrapper">
  <h2><i class="fas fa-user-lock" style="color:var(--primary-light);"></i> Welcome Back</h2>
  <p class="subtitle">Log in to your hospital dashboard</p>

  <form method="POST">
    <div class="form-group">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" required>
    </div>

    <button type="submit" class="btn" style="width:100%; justify-content:center;">
      <i class="fas fa-sign-in-alt"></i> Login
    </button>
  </form>

  <p style="text-align:center; margin-top:1.5rem; color:#5b7e99; font-size:0.9rem;">
    Don't have an account?
    <a href="{{ url_for('register') }}" style="color:var(--primary); font-weight:600; text-decoration:none;">Register</a>
  </p>
</div>
{% endblock %}
